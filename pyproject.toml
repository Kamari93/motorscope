# project metadata and Python requirements
[project]
name = "motorscope"
version = "0.1.0"
description = "A used-vehicle research and ownership-cost analysis tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# tool used to build the package
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# tell hatchling where the package lives
[tool.hatch.build.targets.wheel]
packages = ["app"]